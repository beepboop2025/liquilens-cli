name: Publish npm package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install an OIDC-capable npm CLI
        run: npm install --global npm@11.8.0
      - run: npm ci
      - run: npm test
      - name: Require tag and package versions to match
        if: github.event_name == 'push'
        run: node -e "const p=require('./package.json');if(process.env.GITHUB_REF_NAME!=='v'+p.version)process.exit(1)"
      - name: Refuse to overwrite an existing version on manual retry
        if: github.event_name == 'workflow_dispatch'
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "liquilens@$version" version >/dev/null 2>&1; then
            echo "liquilens@$version already exists; refusing to republish"
            exit 1
          fi
      - run: npm publish --access public
