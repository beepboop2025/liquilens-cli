name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run
      - name: Live public-board smoke
        run: |
          node dist/cli.js --plain > /tmp/liquilens-india.txt
          node dist/cli.js --region us --plain > /tmp/liquilens-us.txt
          node dist/cli.js --record > /tmp/liquilens-record.txt
          head -5 /tmp/liquilens-india.txt
          head -5 /tmp/liquilens-us.txt
          head -8 /tmp/liquilens-record.txt
